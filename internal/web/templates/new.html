<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New issue — litt</title>
  <link rel="stylesheet" href="/static/pico.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="container">
    <header class="litt-header">
      <hgroup>
        <h1><a href="/">litt</a></h1>
        <p>Local-first task graph and execution tracker</p>
      </hgroup>
    </header>

    <nav class="litt-tabs">
      <a href="/?view=open">Open</a>
      <a href="/?view=ready">Ready</a>
      <a href="/?view=blocked">Blocked</a>
      <a href="/?view=all">All</a>
    </nav>

    {{if .Error}}<p class="form-error">{{.Error}}</p>{{end}}

    <h2>New issue</h2>

    <form method="post" action="/issue/new" class="issue-form">
      <input type="hidden" name="csrf" value="{{.CSRF}}">

      <label for="title">Title</label>
      <input type="text" id="title" name="title" value="{{.Title}}" required autofocus>

      <fieldset class="kind-options">
        <legend>Kind</legend>
        <label><input type="radio" name="kind" value="spec"{{if eq .Kind "spec"}} checked{{end}}> spec</label>
        <label><input type="radio" name="kind" value="task"{{if or (eq .Kind "task") (eq .Kind "")}} checked{{end}}> task</label>
        <label><input type="radio" name="kind" value="bug"{{if eq .Kind "bug"}} checked{{end}}> bug</label>
      </fieldset>

      <label for="body">Body</label>
      <textarea id="body" name="body" rows="8">{{.Body}}</textarea>

      <fieldset class="label-options">
        <legend>Labels</legend>
        {{range .Labels}}
        <label>
          <input type="checkbox" name="labels" value="{{.Name}}"{{if index $.Checked .Name}} checked{{end}}>
          {{.Name}}
        </label>
        {{end}}
      </fieldset>

      <button type="submit">Create issue</button>
    </form>
  </main>
</body>
</html>
